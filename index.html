<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>OneSignal Player ID anzeigen</title>
<script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>
</head>
<body>

<h2>Deine OneSignal Player ID12:</h2>
<input type="text" id="playerIdInput" style="width: 400px;" readonly />
<button onclick="copyPlayerId()">Kopieren</button>
<p id="status"></p>

<script>
  window.OneSignal = window.OneSignal || [];
  OneSignal.push(function() {
  OneSignal.init({
    appId: "5930e0bd-4196-4ca1-9e93-bacc6d4c4a73"
  });

  // Event abfangen, wenn sich der Abonnement-Status ändert
  OneSignal.on('subscriptionChange', function(isSubscribed) {
    console.log("subscriptionChange: ", isSubscribed);
    if (isSubscribed) {
      OneSignal.getUserId().then(function(userId) {
        console.log("Player ID (subscriptionChange): ", userId);
        if (userId) {
          document.getElementById("playerIdInput").value = userId;
          document.getElementById("status").innerText = "Push-Benachrichtigungen aktiviert.";
        }
      });
    }
  });

  // Initial prüfen, ob schon aktiviert
  OneSignal.isPushNotificationsEnabled().then(function(isEnabled) {
    console.log("isPushNotificationsEnabled:", isEnabled);
    if (isEnabled) {
      OneSignal.getUserId().then(function(userId) {
        console.log("Player ID (initial): ", userId);
        if (userId) {
          document.getElementById("playerIdInput").value = userId;
          document.getElementById("status").innerText = "Push-Benachrichtigungen aktiviert.";
        }
      });
    } else {
      document.getElementById("status").innerText = "Bitte aktivieren Sie Push-Benachrichtigungen.";
    }
  });
});


  function copyPlayerId() {
    const input = document.getElementById("playerIdInput");
    input.select();
    input.setSelectionRange(0, 99999); // Für Mobilgeräte

    try {
      document.execCommand('copy');
      alert("Player ID kopiert!");
    } catch (err) {
      alert("Kopieren fehlgeschlagen, bitte manuell kopieren.");
    }
  }
</script>

</body>
</html>
